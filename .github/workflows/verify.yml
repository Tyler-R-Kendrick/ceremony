name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            artifacts/coverage/coverage-summary.json
            artifacts/verification/
            artifacts/bundle/size.json
            artifacts/browser/results.json
            artifacts/workflow/results.json
  flows:
    # Every auth scenario driven through a real browser by the agent-browser
    # CLI, recorded. The recordings and console logs are of our own doubles,
    # so nothing provider-owned is retained and the deterministic verification
    # policy is unchanged. Evidence uploads even when a flow fails, which is
    # the point of running it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:flows
      # Built even when a flow fails: a reviewer wants the page most when
      # something did not do what the catalog says it does.
      - run: npm run flows:gallery
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-flows
          path: artifacts/flows/
  mutation:
    name: mutation (${{ matrix.target }})
    runs-on: ubuntu-24.04
    # The full schema scope took 28 minutes on the successful baseline.
    # Keep every mutant and threshold; allow bounded runner/test-growth headroom.
    timeout-minutes: ${{ matrix.target == 'schema' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: connector-authoring
            file: src/core/connector-authoring.ts
          - target: connector-contracts
            file: src/core/connector-contracts.ts
          - target: resolution
            file: src/core/resolution.ts
          - target: execution
            file: src/core/execution.ts
          - target: schema
            file: src/core/schema.ts
          - target: environment
            file: src/server/environment.ts
          - target: storage
            file: src/server/storage.ts
          - target: arazzo
            file: src/server/arazzo.ts
          - target: services
            file: src/server/services.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mutation -- --mutate "${{ matrix.file }}" --concurrency 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.target }}
          path: artifacts/mutation/
