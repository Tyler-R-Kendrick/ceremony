name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # `onnxruntime-node`'s postinstall downloads a CUDA execution-provider package
  # from api.nuget.org. No runner here has a GPU, nothing in the suite uses that
  # provider, and the fetch times out often enough to fail jobs before a single
  # test body runs — which is a install failure wearing a test failure's clothes.
  # The CPU runtime ships inside the package, so skipping the download changes
  # nothing the tests can observe.
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Measured, not guessed. On the last green run the stages came to roughly
    # 21m40s -- test:security:mutation 8m55s and test:e2e 8m17s between them are
    # four fifths of it -- and `npm ci` plus three browser downloads add two to
    # three more. That left the 25-minute ceiling under a minute of headroom,
    # and the first change to add end-to-end specs spent it: this job was
    # cancelled at 25m19s with every stage still passing.
    #
    # A cancelled job is not a failing one, and raising this budget does not
    # relax a single assertion: `verify` still runs every stage, and a stage
    # that fails still fails the job. What it stops doing is reporting the
    # machine's speed as if it were the code's correctness.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            artifacts/coverage/coverage-summary.json
            artifacts/verification/
            artifacts/security-mutation/mutation.json
            artifacts/bundle/size.json
            artifacts/browser/results.json
            artifacts/workflow/results.json
  flows:
    # Every auth scenario driven through a real browser by the agent-browser
    # CLI, recorded. The recordings and console logs are of our own doubles,
    # so nothing provider-owned is retained and the deterministic verification
    # policy is unchanged. Evidence uploads even when a flow fails, which is
    # the point of running it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:flows
      # Built even when a flow fails: a reviewer wants the page most when
      # something did not do what the catalog says it does.
      - run: npm run flows:gallery
        if: always()
      # The published auth catalogue. It bundles the real resolver for the
      # browser, so a change that breaks that bundle breaks a page people are
      # given a link to — and nothing else in the suite builds it.
      - run: npm run build:gallery
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-flows
          path: artifacts/flows/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-catalogue
          path: artifacts/gallery/
  security:
    # `verify` runs these too, but it reports each stage as counts alone: its
    # stage output is captured and discarded by design, so a failure there says
    # "1 failed" and nothing more. These are also the only files that run just
    # once per CI run — Stryker's dry run covers `tests/*.test.ts` and
    # `tests/contracts/*.test.ts`, and nothing else reaches `tests/security/`.
    # Running the same npm script here, outside that wrapper, means a failure
    # arrives with the name of the test that failed. No browsers: nothing in
    # this profile drives one.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:security
  browser-login:
    # `verify` runs these too, but it reports each stage as counts alone: its
    # stage output is captured and discarded by design, so a failure there says
    # "1 failed" and the file it lived in, and nothing more. That is the same
    # reason the `security` job exists.
    #
    # These suites drive three real browser engines, and a failure that only
    # reproduces on a CI machine — not on Node 22, not on Node 24, not under the
    # coverage harness pinned to four CPUs — is precisely the one whose name you
    # need before you can fix it rather than guess at it. Running them here,
    # outside the wrapper and one file at a time, means the failure arrives with
    # the test that failed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node --import tsx --test --test-concurrency=1 tests/browser-login-conformance.test.ts tests/browser-targets.e2e.test.ts tests/browser-session-lifetime.test.ts tests/browser-login-service.test.ts
  coverage:
    # `verify`'s largest stage is `test:coverage`, and the wrapper reports it as
    # counts plus the file a failure lived in — by design, because the retained
    # verification record stores allowlisted inventory names and never raw
    # diagnostics. That is right for the artifact and useless for fixing
    # anything: "1 failed in tests/foo.test.ts" does not say which test.
    #
    # Running the same npm script here, outside the wrapper, puts the failing
    # test's name in the log while leaving the sanitized artifact exactly as it
    # is. Same reason the `security` and `browser-login` jobs exist. The browser
    # engines are installed because the coverage run discovers every suite,
    # including the ones that drive all three.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:coverage
  browser-ui:
    # Two chromium specs fail here on every run and pass locally on every run —
    # five configurations, including with CI=1 set. `verify` runs `test:e2e` and
    # captures its output, and the retained artifact keeps allowlisted
    # coordinates only, so the assertion itself has never been visible.
    #
    # Printing Playwright's own output is safe by this repository's own
    # standard, and AC-24 is the proof: it drives a nested run with a canary in
    # the DOM, in a textarea, in the title and in a dataset attribute, and
    # asserts the process output does not contain it. The fixture strips
    # matcher snapshots and `PLAYWRIGHT_NO_COPY_PROMPT` stops the ARIA dump. So
    # what reaches this log is assertions and locators, never page content.
    #
    # Chromium only: that is where both failures are, and a narrower job is a
    # faster answer.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium tests/browser/connection-plan.spec.ts tests/browser/ceremony.spec.ts
  mutation:
    name: mutation (${{ matrix.target }})
    runs-on: ubuntu-24.04
    # ponytail: one worker for fixed fixture ports; parallelize after listener isolation.
    # Halving workers doubles only the whole-job budget, not test deadlines or thresholds.
    timeout-minutes: ${{ matrix.target == 'connector-authoring' && 360 || matrix.target == 'schema' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: connector-authoring
            file: src/core/connector-authoring.ts
          - target: connector-contracts
            file: src/core/connector-contracts.ts
          - target: resolution
            file: src/core/resolution.ts
          - target: execution
            file: src/core/execution.ts
          - target: schema
            file: src/core/schema.ts
          - target: environment
            file: src/server/environment.ts
          - target: storage
            file: src/server/storage.ts
          - target: arazzo
            file: src/server/arazzo.ts
          - target: services
            file: src/server/services.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The mutation runner establishes an unmutated baseline over every
      # discovered test file first, and the browser-login conformance and
      # stale-target suites drive all three engines. Installing only Chromium
      # made that baseline fail on a missing executable, which is not a
      # mutation result and is not a reason to narrow what those suites cover.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:mutation -- --mutate "${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.target }}
          path: artifacts/mutation/
