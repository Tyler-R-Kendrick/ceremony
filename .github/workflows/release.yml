name: Release
# Publishes @ceremony/auth to npm from a version tag. Nothing else publishes
# it: `prepublishOnly` runs scripts/release-guard.ts, which refuses any publish
# that does not name a tag matching package.json's version, and this is the
# only place that names one.
#
# Either trigger is enough. Publishing a GitHub release usually pushes its tag
# as well, so both can fire for one version; the second run finds the version
# already on the registry and stops without publishing (see "Already
# published?"), and the shared concurrency group keeps the two from racing.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  # The same reason as verify.yml: a GPU runtime download nothing here uses.
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  publish:
    # Never from a fork. A fork has no business publishing this package's
    # name, and on a fork this job is skipped rather than failing.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Created on first use. A maintainer can scope NPM_TOKEN to it and add
    # required reviewers, so a tag push waits for a person before publishing.
    environment: release
    permissions:
      contents: read
      # For npm's provenance statement, which is signed with this job's OIDC
      # token and ties the published tarball to this commit and workflow.
      id-token: write
    env:
      CEREMONY_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      # Before any checkout or install, so a repository without the secret
      # learns why in one line rather than after a full build.
      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error title=NPM_TOKEN is not set::Add an npm automation token as the NPM_TOKEN secret (repository or 'release' environment) before releasing. Nothing was published."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # The tag must name exactly the version being published. The same check
      # runs again inside `npm publish`, from prepublishOnly.
      - name: Tag matches package.json
        run: node --experimental-strip-types scripts/release-guard.ts
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:package
      - name: Already published?
        id: published
        # The token too: setup-node's .npmrc sends whatever NODE_AUTH_TOKEN
        # holds, and its placeholder is not a credential the registry accepts.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          spec="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if npm view "${spec}" version >/dev/null 2>&1; then
            echo "::notice::${spec} is already on the registry; not publishing it again."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      # A prerelease version (1.2.0-rc.1) goes to the `next` dist-tag, so it
      # never becomes what `npm install @ceremony/auth` resolves to.
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "${version}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          # --ignore-scripts: prepublishOnly would re-run check, build and
          # test:package here, with the publish token in their environment.
          # The steps above already ran the guard and all three without it.
          npm publish --ignore-scripts --provenance --access public --tag "${dist_tag}"
