name: Devcontainer
on:
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
      - .nvmrc
      - package.json
      - package-lock.json
      - scripts/clean.mjs
      - tests/project-setup.test.ts
  push:
    branches: [main]
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
      - .nvmrc
      - package.json
      - package-lock.json
      - scripts/clean.mjs
      - tests/project-setup.test.ts
permissions:
  contents: read
concurrency:
  # The same reason as `verify.yml`, and the same split: a pull request's runs
  # supersede each other, a push to main is left alone to finish. This one is
  # path-filtered and so fires rarely, but when it does it builds a container
  # and holds a runner for up to twenty-five minutes — which is precisely when
  # a duplicate queued behind it is worth avoiding.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  devcontainer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          inheritEnv: false
          runCmd: |
            set -eu
            node --version
            npm run check
            npm run test:integration
            npm run test:workflow
            npm run build
            npm run test:package
