<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ceremony — offline</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #17212d;
        background: #f4f6f8;
      }
      main {
        max-width: 42rem;
        margin: 10vh auto;
      }
      h1 {
        font-size: 28px;
      }
      a {
        color: #1749c7;
        display: inline-block;
        padding-block: 12px;
      }
      :focus-visible {
        outline: 2px solid #1749c7;
        outline-offset: 3px;
      }
    </style>

  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Reconnect to check your connection. This screen cannot verify access or
        submit authorization work.
      </p>
      <p>No credentials or pending commands are saved here.</p>
      <a href="/">Reconnect to Ceremony</a>
    </main>
  </body>
</html>
