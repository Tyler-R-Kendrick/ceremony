\* The durable controller as written, checked for one rule alone: a reload
\* never moves a final step.  A lease may run out while its request waits.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
  Workers = {"w1", "w2"}
  MaxRevision = 8
  LeaseRunsOut = TRUE
  Removed = {}
CONSTRAINT Bounded
INVARIANTS
  TypeOK
  ReloadNeverMovesAnEndStep
