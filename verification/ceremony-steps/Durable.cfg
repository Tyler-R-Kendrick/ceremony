\* The durable controller as written: two workers share one database, and a
\* lease may run out while its request waits on the adapter.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
  Workers = {"w1", "w2"}
  MaxRevision = 8
  LeaseRunsOut = TRUE
  Removed = {}
CONSTRAINT Bounded
INVARIANTS
  TypeOK
  OneWorkerAppliesAnswers
  ReloadNeverMovesAnEndStep
  ConnectedMeansConfirmed
  EveryScreenOffersAWayOn
