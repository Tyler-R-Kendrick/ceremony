\* Rule 6 (claim never returns a fence whose lease ran out) on the code as
\* written: claim() reads the clock (index.ts:362), its upsert can wait on
\* the row, and the fence comes back whatever the clock says by then.  The
\* code as written has no such check, so ClaimRefusesExpired is FALSE here.
\* Expected: no error.  Open finding: ClaimNeverReturnsExpiredFence breaks.
SPECIFICATION Spec
CONSTANTS
    Processes = {p1, p2}
    SharedIdentity = TRUE
    Duration = 2
    MaxNow = 4
    MaxEpoch = 3
    MaxWrites = 0
    Deletes = FALSE
    WithEnvironment = TRUE
    CheckGeneration = TRUE
    CheckExpiry = TRUE
    LockFenceRow = TRUE
    ClaimOnlyExpired = TRUE
    ClaimBumpsGeneration = TRUE
    CheckRevision = TRUE
    KeepRetired = TRUE
    Restores = FALSE
    HeartbeatMatchesFence = FALSE
    ClaimRefusesExpired = FALSE
    RestoreBumpsGeneration = FALSE
INVARIANTS
    TypeOK
    ClaimNeverReturnsExpiredFence
