\* Rule 6 (claim never returns a fence whose lease ran out) on the code as
\* written: claim() reads the clock (index.ts:386) and its upsert can wait on
\* the row, but the lease the upsert writes runs from the clock when the row
\* is written (index.ts:392-395), so ClaimLeaseFromUpsert is TRUE.
\* Expected: no error.  This was finding F3 in README.md.
SPECIFICATION Spec
CONSTANTS
    Processes = {p1, p2}
    SharedIdentity = TRUE
    Duration = 2
    MaxNow = 4
    MaxEpoch = 3
    MaxWrites = 0
    Deletes = FALSE
    WithEnvironment = TRUE
    CheckGeneration = TRUE
    CheckExpiry = TRUE
    LockFenceRow = TRUE
    ClaimOnlyExpired = TRUE
    ClaimBumpsGeneration = TRUE
    CheckRevision = TRUE
    KeepRetired = TRUE
    Restores = FALSE
    HeartbeatMatchesFence = TRUE
    ClaimLeaseFromUpsert = TRUE
    RestoreBumpsGeneration = TRUE
INVARIANTS
    TypeOK
    ClaimNeverReturnsExpiredFence
