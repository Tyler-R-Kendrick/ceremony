\* Rule 6 (claim never returns a fence whose lease ran out) on the code as
\* written: claim() reads the clock (index.ts:403) and its upsert can wait on
\* the row, but once the upsert holds the row claim() sets the lease from the
\* clock (index.ts:428-438), so ClaimLeaseAfterUpsert is TRUE, and the UPDATE
\* of the upsert writes it from the clock too (index.ts:413-416), so
\* ClaimLeaseFromUpsert is TRUE.
\* Expected: no error.  This was finding F3 in README.md.
SPECIFICATION Spec
CONSTANTS
    Processes = {p1, p2}
    SharedIdentity = TRUE
    Duration = 2
    MaxNow = 4
    MaxEpoch = 3
    MaxWrites = 0
    Deletes = FALSE
    WithEnvironment = TRUE
    CheckGeneration = TRUE
    CheckExpiry = TRUE
    LockFenceRow = TRUE
    ClaimOnlyExpired = TRUE
    ClaimBumpsGeneration = TRUE
    CheckRevision = TRUE
    KeepRetired = TRUE
    Restores = FALSE
    HeartbeatMatchesFence = TRUE
    ClaimLeaseFromUpsert = TRUE
    ClaimLeaseAfterUpsert = TRUE
    RestoreBumpsGeneration = TRUE
    RestoreEpochFromClock = TRUE
INVARIANTS
    TypeOK
    ClaimNeverReturnsExpiredFence
