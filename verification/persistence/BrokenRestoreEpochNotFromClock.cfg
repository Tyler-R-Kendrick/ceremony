\* Broken variant: RestoreEpochFromClock = FALSE.
\* The restore gives the fresh store the lease epoch of the store the backup
\* came from + 1, not the second of the clock it ran in (index.ts:662-679),
\* so two restores of one backup take the same lease base.  A worker claims
\* on the first restored store, that store is lost, the backup is restored
\* again, another worker with the same worker string claims there and gets
\* the same generation, and the first worker's fence passes.
\* Expected: RestoredStoreRefusesOldFences is violated.
SPECIFICATION Spec
CONSTANTS
    Processes = {p1, p2}
    SharedIdentity = TRUE
    Duration = 2
    MaxNow = 4
    MaxEpoch = 4
    MaxWrites = 0
    Deletes = FALSE
    WithEnvironment = TRUE
    CheckGeneration = TRUE
    CheckExpiry = TRUE
    LockFenceRow = TRUE
    ClaimOnlyExpired = TRUE
    ClaimBumpsGeneration = TRUE
    CheckRevision = TRUE
    KeepRetired = TRUE
    Restores = TRUE
    HeartbeatMatchesFence = TRUE
    ClaimLeaseFromUpsert = TRUE
    ClaimLeaseAfterUpsert = TRUE
    RestoreBumpsGeneration = TRUE
    RestoreEpochFromClock = FALSE
INVARIANTS
    TypeOK
    RestoredStoreRefusesOldFences
