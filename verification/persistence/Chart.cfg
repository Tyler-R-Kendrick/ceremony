\* A small model for the chart only: two processes, a clock with one tick
\* (one lease can run out), four changes of hands, no record writes, no
\* restarts and no writers without a lease.  /statechart draws a whole graph
\* only up to 500 states.  Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Processes = {p1, p2}
    SharedIdentity = TRUE
    Duration = 1
    MaxNow = 1
    MaxEpoch = 4
    MaxWrites = 0
    Deletes = FALSE
    WithEnvironment = FALSE
    CheckGeneration = TRUE
    CheckExpiry = TRUE
    LockFenceRow = TRUE
    ClaimOnlyExpired = TRUE
    ClaimBumpsGeneration = TRUE
    CheckRevision = TRUE
    KeepRetired = TRUE
    Restores = FALSE
    HeartbeatMatchesFence = TRUE
    ClaimLeaseFromUpsert = TRUE
    RestoreBumpsGeneration = TRUE
INVARIANTS
    StaleFenceNeverCommits
    LiveLeaseNeverTakenOver
    ExpiredFenceNeverPasses
    StaleRevisionNeverWrites
