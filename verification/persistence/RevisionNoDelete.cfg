\* Rule 4 (the revision check) for a key whose record is never deleted.
\* Expected: no error.
SPECIFICATION Spec
SYMMETRY Symmetry
CONSTANTS
    Processes = {p1, p2}
    SharedIdentity = TRUE
    Duration = 2
    MaxNow = 2
    MaxEpoch = 2
    MaxWrites = 4
    Deletes = FALSE
    WithEnvironment = TRUE
    CheckGeneration = TRUE
    CheckExpiry = TRUE
    LockFenceRow = TRUE
    ClaimOnlyExpired = TRUE
    ClaimBumpsGeneration = TRUE
    CheckRevision = TRUE
    KeepRetired = TRUE
INVARIANTS
    TypeOK
    StaleRevisionNeverWrites
