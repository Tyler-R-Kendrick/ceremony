\* Rule 7 (a restored store refuses every fence from before the restore) on
\* the code as written, with one backup and one restore (Restores = TRUE).
\* The restore writes generation + 1 for a key in the backup and nothing for
\* a key that is not (index.ts:570-573), so a worker that claimed after the
\* backup can hold a generation the restored store hands out again.  The
\* code as written has no other check, so RestoreBumpsGeneration is FALSE.
\* Expected: no error.  Open finding: RestoredStoreRefusesOldFences breaks.
SPECIFICATION Spec
CONSTANTS
    Processes = {p1, p2}
    SharedIdentity = TRUE
    Duration = 2
    MaxNow = 4
    MaxEpoch = 3
    MaxWrites = 0
    Deletes = FALSE
    WithEnvironment = TRUE
    CheckGeneration = TRUE
    CheckExpiry = TRUE
    LockFenceRow = TRUE
    ClaimOnlyExpired = TRUE
    ClaimBumpsGeneration = TRUE
    CheckRevision = TRUE
    KeepRetired = TRUE
    Restores = TRUE
    HeartbeatMatchesFence = FALSE
    ClaimRefusesExpired = FALSE
    RestoreBumpsGeneration = FALSE
INVARIANTS
    TypeOK
    RestoredStoreRefusesOldFences
