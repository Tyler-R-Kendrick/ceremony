\* Rule 7 (a restored store refuses every fence from before the restore) on
\* the code as written, with one backup restored twice (Restores = TRUE).
\* The restored store takes a lease base above every generation of the store
\* the backup came from, and hands out only that base plus a count
\* (index.ts:643-681, :411, :448), so RestoreBumpsGeneration is TRUE.  Its
\* lease epoch is the second of the clock its restore ran in
\* (index.ts:648-665), so RestoreEpochFromClock is TRUE.  MaxEpoch = 4 lets a
\* worker claim on each restored store.
\* Expected: no error.  This was finding F4 in README.md.
SPECIFICATION Spec
CONSTANTS
    Processes = {p1, p2}
    SharedIdentity = TRUE
    Duration = 2
    MaxNow = 4
    MaxEpoch = 4
    MaxWrites = 0
    Deletes = FALSE
    WithEnvironment = TRUE
    CheckGeneration = TRUE
    CheckExpiry = TRUE
    LockFenceRow = TRUE
    ClaimOnlyExpired = TRUE
    ClaimBumpsGeneration = TRUE
    CheckRevision = TRUE
    KeepRetired = TRUE
    Restores = TRUE
    HeartbeatMatchesFence = TRUE
    ClaimLeaseFromUpsert = TRUE
    RestoreBumpsGeneration = TRUE
    RestoreEpochFromClock = TRUE
INVARIANTS
    TypeOK
    RestoredStoreRefusesOldFences
