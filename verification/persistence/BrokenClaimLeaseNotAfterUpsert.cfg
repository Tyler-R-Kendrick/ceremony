\* Broken variant: ClaimLeaseAfterUpsert = FALSE.
\* index.ts:428-438  claim() does not set the lease again once the upsert
\* holds the row.  The INSERT of a key with no row computed its expiry when
\* the statement started; on PostgreSQL it can wait on another transaction's
\* insert of the row that then rolls back, and writes that expiry, so the
\* lease can have run out when claim() returns it.
\* Expected: ClaimNeverReturnsExpiredFence is violated.
