\* Rule 5 (a heartbeat extends only its own lease) with the row lock of
\* assertFence taken out (LockFenceRow = FALSE): the heartbeat UPDATE itself
\* must keep to the fence's lease.  That UPDATE names the fence's generation
\* and worker (index.ts:446-455), so HeartbeatMatchesFence is TRUE.
\* Expected: no error.  This was finding F2 in README.md.
SPECIFICATION Spec
CONSTANTS
    Processes = {p1, p2}
    SharedIdentity = TRUE
    Duration = 2
    MaxNow = 4
    MaxEpoch = 3
    MaxWrites = 0
    Deletes = FALSE
    WithEnvironment = TRUE
    CheckGeneration = TRUE
    CheckExpiry = TRUE
    LockFenceRow = FALSE
    ClaimOnlyExpired = TRUE
    ClaimBumpsGeneration = TRUE
    CheckRevision = TRUE
    KeepRetired = TRUE
    Restores = FALSE
    HeartbeatMatchesFence = TRUE
    ClaimLeaseFromUpsert = TRUE
    ClaimLeaseAfterUpsert = TRUE
    RestoreBumpsGeneration = TRUE
    RestoreEpochFromClock = TRUE
INVARIANTS
    TypeOK
    HeartbeatExtendsOnlyOwnLease
