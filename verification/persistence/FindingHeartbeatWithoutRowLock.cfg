\* Rule 5 (a heartbeat extends only its own lease) with the row lock of
\* assertFence taken out (LockFenceRow = FALSE): the heartbeat UPDATE itself
\* must keep to the fence's lease.  The code as written has no generation
\* in that UPDATE (index.ts:373-376), so HeartbeatMatchesFence is FALSE here.
\* Expected: no error.  Open finding: HeartbeatExtendsOnlyOwnLease breaks.
SPECIFICATION Spec
CONSTANTS
    Processes = {p1, p2}
    SharedIdentity = TRUE
    Duration = 2
    MaxNow = 4
    MaxEpoch = 3
    MaxWrites = 0
    Deletes = FALSE
    WithEnvironment = TRUE
    CheckGeneration = TRUE
    CheckExpiry = TRUE
    LockFenceRow = FALSE
    ClaimOnlyExpired = TRUE
    ClaimBumpsGeneration = TRUE
    CheckRevision = TRUE
    KeepRetired = TRUE
    Restores = FALSE
    HeartbeatMatchesFence = FALSE
    ClaimRefusesExpired = FALSE
    RestoreBumpsGeneration = FALSE
INVARIANTS
    TypeOK
    HeartbeatExtendsOnlyOwnLease
