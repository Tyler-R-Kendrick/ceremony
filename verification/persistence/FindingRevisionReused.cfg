\* Rule 4 (the revision check) on the code as written, records can be deleted
\* and created again.  Expected: no error.  This was finding F1 in README.md.
SPECIFICATION Spec
CONSTANTS
    Processes = {p1, p2}
    SharedIdentity = TRUE
    Duration = 2
    MaxNow = 1
    MaxEpoch = 2
    MaxWrites = 3
    Deletes = TRUE
    WithEnvironment = TRUE
    CheckGeneration = TRUE
    CheckExpiry = TRUE
    LockFenceRow = TRUE
    ClaimOnlyExpired = TRUE
    ClaimBumpsGeneration = TRUE
    CheckRevision = TRUE
    KeepRetired = TRUE
    Restores = FALSE
    HeartbeatMatchesFence = TRUE
    ClaimLeaseFromUpsert = TRUE
    RestoreBumpsGeneration = TRUE
INVARIANTS
    TypeOK
    StaleRevisionNeverWrites
