\* The code as written, with none of the four triggers of the findings:
\* one request at a time, GitHub may fail only while a return is handled,
\* the right account, no process dies.  Expected: no error, so NoDeadEnd
\* holds here and each finding needs its trigger.
CONSTANTS
  Returns = {r1}
  GitHubFailsInReturn = TRUE
  GitHubFailsInSteps = {}
  WrongAccountPossible = FALSE
  RequestsDie = FALSE
  RequestsOverlap = FALSE
  AdmitComparesRevision = TRUE
  AppReadyAssertsFence = TRUE
  SaveChecksCancelled = TRUE
  ReturnChecksInstallation = TRUE
  RerunUncertain = {"app", "inst", "access"}
  RefusalLeavesRun = TRUE
INIT Init
NEXT Next
INVARIANTS
  TypeOK
  NoDeadEnd
