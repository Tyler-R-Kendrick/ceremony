\* Finding 3.  The code as written, one request at a time; GitHub may fail to
\* answer the install step or the token step.  Expected: no error; both steps
\* are replay "read-only" and run again from "uncertain".
CONSTANTS
  Returns = {r1}
  GitHubFailsInReturn = FALSE
  GitHubFailsInSteps = {"inst", "access"}
  WrongAccountPossible = FALSE
  RequestsDie = FALSE
  RequestsOverlap = FALSE
  AdmitComparesRevision = TRUE
  AppReadyAssertsFence = TRUE
  SaveChecksCancelled = TRUE
  ReturnChecksInstallation = TRUE
  RerunUncertain = {"app", "inst", "access"}
  RefusalLeavesRun = TRUE
INIT Init
NEXT Next
INVARIANTS
  LaterStepsNeverStranded
