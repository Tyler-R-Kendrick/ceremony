\* The code as written, in the widest surroundings: two returns, GitHub may
\* fail anywhere, processes may die.  Expected: no error.
\* NoDeadEnd: no state where the run is active, not connected, and nothing
\* but Cancel is possible.  RestartWithoutWaiting and NothingStoredAfterCancel
\* are the two notes of README.md, Findings.
CONSTANTS
  Returns = {r1, r2}
  GitHubFailsInReturn = TRUE
  GitHubFailsInSteps = {"app", "inst", "access"}
  WrongAccountPossible = TRUE
  RequestsDie = TRUE
  RequestsOverlap = TRUE
  AdmitComparesRevision = TRUE
  AppReadyAssertsFence = TRUE
  SaveChecksCancelled = TRUE
  ReturnChecksInstallation = TRUE
  RerunUncertain = {"app", "inst", "access"}
  RefusalLeavesRun = TRUE
  ExpiryRetriesOnConflict = TRUE
  RestartReplacesForeignApp = TRUE
  ReturnReleasesClaim = TRUE
  StoreChecksRun = TRUE
SYMMETRY Symmetry
INIT Init
NEXT Next
INVARIANTS
  TypeOK
  ConvertedAtMostOnce
  CancelledStaysCancelled
  InstallationCheckedBeforeToken
  RefusedReturnLeavesRun
  AppReadyNeverStranded
  ExpiredHandoffNeverStranded
  LaterStepsNeverStranded
  WrongAccountNeverStranded
  NoDeadEnd
  RestartWithoutWaiting
  TimersNeverRescue
PROPERTIES
  NothingStoredAfterCancel
  ExpiryWrittenByTheStep
