\* The code as written, in the widest surroundings: two returns, GitHub may
\* fail anywhere, processes may die.  Expected: no error.
\* NoDeadEnd is not listed because it does not hold today (README, Findings):
\* the rules of the fixed findings 1 to 3 are, and OnlyKnownDeadEnds fails as
\* soon as a dead end of another shape than finding 4 appears.
CONSTANTS
  Returns = {r1, r2}
  GitHubFailsInReturn = TRUE
  GitHubFailsInSteps = {"app", "inst", "access"}
  WrongAccountPossible = TRUE
  RequestsDie = TRUE
  RequestsOverlap = TRUE
  AdmitComparesRevision = TRUE
  AppReadyAssertsFence = TRUE
  SaveChecksCancelled = TRUE
  ReturnChecksInstallation = TRUE
  RerunUncertain = {"app", "inst", "access"}
SYMMETRY Symmetry
INIT Init
NEXT Next
INVARIANTS
  TypeOK
  ConvertedAtMostOnce
  CancelledStaysCancelled
  InstallationCheckedBeforeToken
  AppReadyNeverStranded
  ExpiredHandoffNeverStranded
  LaterStepsNeverStranded
  OnlyKnownDeadEnds
  TimersNeverRescue
