\* For the /statechart skill only: the code as written, one return, one
\* request at a time, so that the whole flow fits one chart.  GitHub may fail
\* during the return and during the app step.  Expected: no error; after an
\* unanswered call the app step runs again.
CONSTANTS
  Returns = {r1}
  GitHubFailsInReturn = TRUE
  GitHubFailsInSteps = {"app"}
  WrongAccountPossible = FALSE
  RequestsDie = FALSE
  RequestsOverlap = FALSE
  AdmitComparesRevision = TRUE
  AppReadyAssertsFence = TRUE
  SaveChecksCancelled = TRUE
  ReturnChecksInstallation = TRUE
  RerunUncertain = {"app", "inst", "access"}
INIT Init
NEXT Next
INVARIANTS
  TypeOK
  ConvertedAtMostOnce
  CancelledStaysCancelled
  InstallationCheckedBeforeToken
  NoDeadEnd
  TimersNeverRescue
