# A catalog defect: the parameter carries a credential but declares neither
# format: password nor the credentials descriptor, and it even ships a default.
apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: fixture-unmarked-credential-sink
  annotations:
    camel.apache.org/catalog.version: "4.22.0"
    camel.apache.org/provider: "Ceremony fixtures"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Fixture unmarked credential sink"
    description: A sink whose credential parameter is not declared as one.
    required:
      - endpoint
      - apiKey
    type: object
    properties:
      endpoint:
        title: Endpoint
        description: The service endpoint path.
        type: string
      apiKey:
        title: API key
        description: The API key used to authenticate.
        type: string
        default: "CANARY_FIXTURE_DEFAULT_KEY"
  dependencies:
    - "camel:kamelet"
    - "camel:http"
  template:
    from:
      uri: "kamelet:source"
      steps:
        - to: "https:{{endpoint}}"
