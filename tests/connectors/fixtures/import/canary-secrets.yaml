openapi: 3.1.0
info:
  title: Canary
  version: "1"
  description: Support contact token CANARY_SECRET_9f3 must never leave the artifact.
servers:
  - url: https://api.example/v1?sig=CANARY_SECRET_9f3
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Example key CANARY_SECRET_9f3
  parameters:
    Auth:
      name: Authorization
      in: header
      schema:
        type: string
        default: Bearer CANARY_SECRET_9f3
      example: Bearer CANARY_SECRET_9f3
paths:
  /files:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              example:
                url: https://files.example/a.png?X-Amz-Signature=CANARY_SECRET_9f3
                token: CANARY_SECRET_9f3
