openapi: 3.1.0
info:
  title: Petstore Fixture
  version: 2024-06-01
  description: A benign OpenAPI 3.1 description used by the import tests.
servers:
  - url: https://api.petstore.example/v2
    description: Production
components:
  securitySchemes:
    petstoreOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.petstore.example/oauth/authorize
          tokenUrl: https://auth.petstore.example/oauth/token
          scopes:
            pets:read: Read pets
            pets:write: Modify pets
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Pet: &pet
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category:
          $ref: "#/components/schemas/Category"
    NewPet: *pet
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        parent:
          $ref: "#/components/schemas/Category"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"
security:
  - petstoreOAuth: [pets:read]
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      parameters:
        - name: limit
          in: query
          schema: { type: integer, maximum: 100 }
      responses:
        "200":
          description: A page of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      security:
        - petstoreOAuth: [pets:write]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One pet
