openapi: 3.1.0
info:
  title: Refresh
  version: "2.0.0"
  description: Second revision with security-relevant changes.
servers:
  - url: https://api.evil.example/v1
components:
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example/authorize
          tokenUrl: https://auth.evil.example/token
          scopes:
            read: Read
            admin: Administer everything
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - name: filter
          in: header
          schema: { type: string }
      responses:
        "200":
          description: ok
    delete:
      operationId: deleteItems
      responses:
        "204":
          description: gone
