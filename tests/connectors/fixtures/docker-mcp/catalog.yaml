# Docker MCP catalog, format version 2.
#
# Hand-authored from the documented catalog format and the shapes observed in
# Docker's served catalog on 2026-09-18 (docs.docker.com/ai/mcp-catalog-and-toolkit,
# docker/mcp-registry server.yaml, desktop.docker.com/mcp/catalog/v2/catalog.yaml).
# Nothing here is generated by the reader under test: the file is the contract.
version: 2
name: ceremony-fixture
displayName: Ceremony Fixture Catalog
registry:
  brave:
    description: Search the Web for pages, images, news, videos, and more using the Brave Search API.
    title: Brave Search
    type: server
    dateAdded: "2025-05-05T20:08:35Z"
    image: mcp/brave-search@sha256:f58a5c22c1196ec7bd1ca586ce216f2334fc298550ddcf652c0e8adb6d256d78
    ref: ""
    readme: https://desktop.docker.com/mcp/catalog/v2/readme/brave.md
    toolsUrl: https://desktop.docker.com/mcp/catalog/v2/tools/brave.json
    source: https://github.com/brave/brave-search-mcp-server/tree/fd28e3e7b3e1911b4a2ba87a199feb86ec173c60
    upstream: https://github.com/brave/brave-search-mcp-server
    icon: https://avatars.githubusercontent.com/u/12301619?s=200&v=4
    tools:
      - name: brave_image_search
      - name: brave_news_search
      - name: brave_web_search
    secrets:
      - name: brave.api_key
        env: BRAVE_API_KEY
        example: YOUR_API_KEY_HERE
        description: See Getting an API key in the upstream README.
    env:
      - name: BRAVE_MCP_TRANSPORT
        value: stdio
    prompts: 0
    resources: {}
    metadata:
      pulls: 269956
      stars: 26
      githubStars: 1445
      category: search
      tags:
        - brave
        - search
      license: MIT License
      owner: brave

  couchbase:
    description: Couchbase is a distributed document database with a powerful search engine.
    title: Couchbase
    type: server
    dateAdded: "2025-07-29T14:05:27Z"
    image: mcp/couchbase@sha256:85a104706d8b2b3bceddf47f2a0e30e68dd5ddcdc2cbff3faa48e885d4b9f4bc
    ref: ""
    readme: https://desktop.docker.com/mcp/catalog/v2/readme/couchbase.md
    source: https://github.com/Couchbase-Ecosystem/mcp-server-couchbase/tree/1454b7b57b85fcb7fb1a72b8f248af9fbb0b5cdc
    upstream: https://github.com/Couchbase-Ecosystem/mcp-server-couchbase
    icon: https://avatars.githubusercontent.com/u/605755?s=200&v=4
    tools:
      - name: get_document_by_id
      - name: run_sql_plus_plus_query
    secrets:
      - name: couchbase.cb_password
        env: CB_PASSWORD
        example: <CB_PASSWORD>
        description: Password for the Couchbase cluster with access to the bucket.
    env:
      - name: CB_CONNECTION_STRING
        value: "{{couchbase.cb_connection_string}}"
      - name: CB_USERNAME
        value: "{{couchbase.cb_username}}"
    prompts: 0
    resources: {}
    config:
      - name: couchbase
        description: Configure the connection to Couchbase
        type: object
        properties:
          cb_connection_string:
            type: string
            description: Connection string for the Couchbase cluster.
          cb_username:
            type: string
            description: Username for the Couchbase cluster with access to the bucket.
        required:
          - cb_connection_string
    metadata:
      pulls: 36143
      githubStars: 34
      category: database
      tags:
        - couchbase
        - database
      license: Apache License 2.0
      owner: couchbase

  github-official:
    description: Official GitHub MCP Server, by GitHub.
    title: GitHub Official
    type: server
    dateAdded: "2025-05-05T20:08:35Z"
    image: ghcr.io/github/github-mcp-server@sha256:508a0857ec762b1ab1cece29193345b501fab1dd9d1228a7b617062954cecac6
    ref: ""
    source: https://github.com/github/github-mcp-server/tree/23fa0dd1a821d1346c1de2abafe7327d26981606
    upstream: https://github.com/github/github-mcp-server
    icon: https://avatars.githubusercontent.com/u/9919?s=200&v=4
    tools:
      - name: get_me
      - name: search_repositories
    secrets:
      - name: github.personal_access_token
        env: GITHUB_PERSONAL_ACCESS_TOKEN
        example: <YOUR_TOKEN>
        description: Create a GitHub personal access token in your account settings.
    allowHosts:
      - api.github.com:443
      - github.com:443
      - raw.githubusercontent.com:443
    prompts: 0
    resources: {}
    oauth:
      providers:
        - provider: github
          secret: github.personal_access_token
          env: GITHUB_PERSONAL_ACCESS_TOKEN
    metadata:
      githubStars: 32987
      category: devops
      tags:
        - github
        - devops
      license: MIT License
      owner: github

  context7:
    description: Pull up-to-date, version-specific documentation straight into your prompt.
    title: Context7
    type: remote
    dateAdded: "2025-05-05T20:08:35Z"
    ref: ""
    readme: https://desktop.docker.com/mcp/catalog/v2/readme/context7.md
    source: ""
    remote:
      transport_type: streamable-http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: "${CONTEXT7_API_KEY}"
    icon: https://avatars.githubusercontent.com/u/74989412?s=200&v=4
    tools: []
    secrets:
      - name: context7.api_key
        env: CONTEXT7_API_KEY
        example: <YOUR_API_KEY>
    prompts: 0
    resources: {}
    metadata:
      category: documentation
      tags:
        - documentation
        - remote
      license: Apache License 2.0
      owner: docker

  desktop-commander:
    description: Search, update, manage files and run terminal commands with AI.
    title: Desktop Commander
    type: server
    longLived: true
    dateAdded: "2025-05-05T20:08:35Z"
    image: mcp/desktop-commander@sha256:5df787069e37bbed40b0dd41d4b3589ddd1c1530589efa0b3e41abc833974068
    ref: ""
    source: https://github.com/wonderwhy-er/DesktopCommanderMCP/tree/0ad919bc188947fc55b1bf269df62f4b14b3880c
    icon: https://raw.githubusercontent.com/wonderwhy-er/DesktopCommanderMCP/main/icon.png
    tools: []
    volumes:
      - "{{desktop-commander.paths|volume|into}}"
    prompts: 0
    resources: {}
    config:
      - name: desktop-commander
        description: Configure filesystem access for Desktop Commander
        type: object
        properties:
          paths:
            type: array
            description: List of directories that Desktop Commander can access
            items:
              type: string
        required:
          - paths
    metadata:
      pulls: 227878
      githubStars: 9616
      category: devops
      tags:
        - filesystem
        - local-system
      license: MIT License
      owner: wonderwhy-er

  curl:
    description: Standard curl tool.
    title: Curl
    type: poci
    dateAdded: "2025-05-05T20:04:34Z"
    ref: ""
    source: ""
    icon: https://avatars.githubusercontent.com/u/16928085?s=200&v=4
    tools:
      - name: curl
        description: Run a curl command.
        parameters:
          type: object
          properties:
            args:
              type: array
              description: The arguments to pass to curl
              items:
                type: string
          required:
            - args
        container:
          image: alpine/curl@sha256:d7720f8cffb47e7a80d01fb2c1b38562fab0e436948537e9b77dc312d29d12d6
          command:
            - "{{args|into}}"
    prompts: 0
    resources: {}
    metadata:
      category: devops
      tags:
        - http
      license: Apache License 2.0
      owner: docker

  unpinned-tag:
    description: A catalog entry whose image is a moving tag rather than a digest.
    title: Unpinned Tag
    type: server
    dateAdded: "2026-01-02T00:00:00Z"
    image: mcp/example-unpinned:latest
    ref: ""
    tools:
      - name: ping
    prompts: 0
    resources: {}
    metadata:
      category: devops
      tags:
        - example
      owner: example
